<!-- Purple Standard email signature — v2 (CodeTwo-ready, dynamic). -->
<!-- v2 is signature-purple-standard.html verbatim plus ONE added row: the cross-brand -->
<!-- icon strip directly above the "Powered by The Purple Standard" endorsement. Nothing -->
<!-- else differs — same Arial stack, same website URL line, same address wording, same -->
<!-- hosted badge and endorsement URLs, same 500px table. Diff v1 against this file to -->
<!-- confirm; the only hunk should be the "Brand icons" <tr>. -->
<!--                                                                                    -->
<!-- NOTE: this supersedes the earlier v2 (ADR 0005), which also removed the website URL -->
<!-- and moved the address up. Michael's 2026-08-04 direction is that v2 must differ from -->
<!-- v1 by the icon strip alone. See ADR 0009. -->
<!--                                                                                    -->
<!-- Brand icons use treatment C ("native shapes") — each brand asset trimmed and scaled -->
<!-- to fit a 40px box with no shape forcing. Built by build-icons.sh into out/c-native/. -->
<!--                                                                                    -->
<!-- 2026-08-06: six icons, not eight. The MOR and ENG grey placeholders were removed at -->
<!-- Michael's direction, so the strip now shows only brands that have real artwork.     -->
<!-- This narrows ADR 0005's "reflect the true end state" call; note it when amending.   -->
<!-- Brisa now uses the real bear mark (brisa-logo.png), replacing the circular badge     -->
<!-- whose ring text was illegible at 40px.                                              -->
<!--                                                                                    -->
<!-- BEFORE LOADING INTO CODETWO, two swaps are still outstanding:                       -->
<!--  1. Icon src — upload out/c-native/*.png alongside the existing hosted assets and    -->
<!--     replace each relative src with:                                                 -->
<!--       https://assets.purple-standard.app/standard/email-signature/brand-<slug>.png   -->
<!--     Verify served bytes with a cache-buster before shipping (ADR 0008): a 200 with   -->
<!--     WebP bytes from a .png URL will break Outlook.                                   -->
<!--  2. Per-brand links — every icon currently points at purple-standard.com. Each TODO  -->
<!--     marks a link awaiting that brand's real site URL.                                -->
<table cellspacing="0" cellpadding="0" id="ps-signature" style="width: 500px; border-collapse: collapse; line-height: initial">
  <tbody>
    <tr>
      <td style="width: 400px; height: auto; padding: 0 0 8px 0; vertical-align: top" colspan="3">
        <p style="margin: 0.1pt; font-family: Arial, Helvetica, sans-serif; font-size: 12pt; color: #49104F" data-codetwo-visible="Name">
          <b>{First name} {Last name}</b>
        </p>
        <p style="margin: 2pt 0 0 0; font-family: Arial, Helvetica, sans-serif; font-size: 10pt; color: #49104F" data-codetwo-visible="Job title">
          <b>{RT}{Title}{/RT}</b>
        </p>
      </td>
      <td style="width: 90px; height: auto; padding: 0; vertical-align: top" rowspan="2">
        <p style="margin: 0.1pt; font-family: Arial, Helvetica, sans-serif; font-size: 10pt; text-align: right" data-codetwo-visible="Logo">
          <a href="https://www.purple-standard.com" target="_blank"><img src="https://assets.purple-standard.app/standard/email-signature/tps-badge.png" border="0" alt="Purple Standard" width="75" height="75" style="width: 75px; height: 75px"></a>
        </p>
      </td>
    </tr>
    <tr>
      <td style="width: 400px; height: auto; padding: 0; vertical-align: top" colspan="3">
        <p style="margin: 0.1pt; font-family: Arial, Helvetica, sans-serif; font-size: 9pt; color: #808080" data-codetwo-visible="Phone">
          <b style="color: #49104F">T:</b> <a href="tel:+18133039975" style="color: #808080; text-decoration: none">(813) 303-9975</a>{RT}&nbsp;&nbsp;&nbsp;<b style="color: #49104F">M:</b> <a href="tel:{Mobile}" style="color: #808080; text-decoration: none">{Mobile}</a>{/RT}
        </p>
        <p style="margin: 0.1pt; font-family: Arial, Helvetica, sans-serif; font-size: 9pt; color: #808080" data-codetwo-visible="Email">
          <b style="color: #49104F">E:</b> <a href="mailto:{E-mail}" style="color: #A263D2; text-decoration: none">{E-mail}</a>
        </p>
        <p style="margin: 0.1pt; font-family: Arial, Helvetica, sans-serif; font-size: 9pt; color: #808080" data-codetwo-visible="Website">
          <a href="https://www.purple-standard.com" target="_blank" style="color: #A263D2; text-decoration: none"><b>www.purple-standard.com</b></a>
        </p>
        <p style="margin: 4pt 0 0 0; font-family: Arial, Helvetica, sans-serif; font-size: 9pt; color: #808080" data-codetwo-visible="Company address">8011 Land O' Lakes Blvd, Land O' Lakes, FL 34638</p>
      </td>
    </tr>
    <tr data-codetwo-visible="Brand icons">
      <td style="width: 500px; height: auto; padding: 12px 0 0 0; vertical-align: middle" colspan="4">
        <table cellspacing="0" cellpadding="0" style="border-collapse: collapse">
          <tbody>
            <tr>
              <td style="padding: 0 12px 0 0; vertical-align: middle"><a href="https://www.purple-standard.com" target="_blank" title="ACE Septic &amp; Waste"><!-- TODO: ACE site URL --><img src="out/c-native/brand-ace.png" border="0" alt="ACE Septic &amp; Waste" width="40" height="40" style="width: 40px; height: 40px"></a></td>
              <td style="padding: 0 12px 0 0; vertical-align: middle"><a href="https://www.purple-standard.com" target="_blank" title="Purple Current"><!-- TODO: Purple Current site URL --><img src="out/c-native/brand-purple-current.png" border="0" alt="Purple Current" width="40" height="40" style="width: 40px; height: 40px"></a></td>
              <td style="padding: 0 12px 0 0; vertical-align: middle"><a href="https://www.purple-standard.com" target="_blank" title="Boyette Pump &amp; Well"><!-- TODO: Boyette site URL --><img src="out/c-native/brand-boyette.png" border="0" alt="Boyette Pump &amp; Well" width="40" height="40" style="width: 40px; height: 40px"></a></td>
              <td style="padding: 0 12px 0 0; vertical-align: middle"><a href="https://www.purple-standard.com" target="_blank" title="WTR DR"><!-- TODO: WTR DR site URL --><img src="out/c-native/brand-wtr-dr.png" border="0" alt="WTR DR" width="40" height="40" style="width: 40px; height: 40px"></a></td>
              <td style="padding: 0 12px 0 0; vertical-align: middle"><a href="https://www.purple-standard.com" target="_blank" title="Brisa Climate"><!-- TODO: Brisa Climate site URL --><img src="out/c-native/brand-brisa.png" border="0" alt="Brisa Climate" width="40" height="40" style="width: 40px; height: 40px"></a></td>
              <td style="padding: 0 0 0 0; vertical-align: middle"><a href="https://www.purple-standard.com" target="_blank" title="Tyrian Roofing"><!-- TODO: Tyrian Roofing site URL --><img src="out/c-native/brand-tyrian.png" border="0" alt="Tyrian Roofing" width="40" height="40" style="width: 40px; height: 40px"></a></td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
    <tr data-codetwo-visible="Banner">
      <td style="width: 500px; height: auto; padding: 14px 0 0 0; vertical-align: top" colspan="4">
        <p style="margin: 0.1pt; font-family: Arial, Helvetica, sans-serif; font-size: 10pt">
          <a href="https://www.purple-standard.com" target="_blank"><img src="https://assets.purple-standard.app/standard/email-signature/tps-endorsement.png" border="0" alt="Powered by The Purple Standard" width="500" height="24" style="width: 500px; height: 24px"></a>
        </p>
      </td>
    </tr>
  </tbody>
</table>
<p style="margin: 0.1pt; font-family: Arial, Helvetica, sans-serif; font-size: 10pt"><br></p>
