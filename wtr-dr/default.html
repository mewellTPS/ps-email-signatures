<!-- WTR DR — STANDARDIZED DEFAULT — three-zone (logo | name/contact | address/social). CodeTwo-ready. -->
<!-- No per-user content is hardcoded: Name, Title, Phone, Mobile, and E-mail resolve from Entra per person; -->
<!-- each dynamic line is RT-wrapped. Company address is the shared 21516 Carson Dr HQ (static). -->
<table cellspacing="0" cellpadding="0" id="wtrdr-signature" style="border-collapse: collapse; line-height: initial">
  <tbody>
    <tr>
      <!-- LOGO + ENDORSEMENT (stacked, centered; endorsement width drives column to ~190px) -->
      <td style="padding: 0 24px 0 0; vertical-align: middle; text-align: center" data-codetwo-visible="Logo">
        <a href="https://wtrdr.com/" target="_blank"><img src="https://assets.purple-standard.app/wtrdr/email-signature/logo.png" border="0" alt="WTR DR logo" width="100" height="100" style="width: 100px; height: 100px"></a>
        <a href="https://www.purple-standard.com/" target="_blank"><img src="https://assets.purple-standard.app/wtrdr/email-signature/endorsement.png" border="0" alt="Powered by The Purple Standard" width="190" height="9" style="display: block; width: 190px; height: 9px; margin: 12px auto 0"></a>
      </td>

      <!-- NAME / TITLE / PHONE / MOBILE / EMAIL -->
      <td style="padding: 0 24px; vertical-align: middle; border-left: 2px solid #1C2458">
        <p style="margin: 0; font-family: Arial, sans-serif; font-size: 16pt; line-height: 1; color: #1C2458" data-codetwo-visible="Name"><b>{First name} {Last name}</b></p>
        <p style="margin: 3pt 0 0 0; font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.2; color: #666666" data-codetwo-visible="Job title">{RT}{Title}{/RT}</p>
        <p style="margin: 10pt 0 0 0; font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.5; color: #666666" data-codetwo-visible="Phone">{RT}<b style="color: #1C2458">Phone:</b> <a href="tel:{Phone}" style="color: #666666; text-decoration: none">{Phone}</a>{/RT}</p>
        <p style="margin: 3pt 0 0 0; font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.5; color: #666666" data-codetwo-visible="Mobile">{RT}<b style="color: #1C2458">Mobile:</b> <a href="tel:{Mobile}" style="color: #666666; text-decoration: none">{Mobile}</a>{/RT}</p>
        <p style="margin: 3pt 0 0 0; font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.5; color: #666666" data-codetwo-visible="Email">{RT}<b style="color: #1C2458">Email:</b> <a href="mailto:{E-mail}" style="color: #2E6DA6; text-decoration: none">{E-mail}</a>{/RT}</p>
      </td>

      <!-- ADDRESS / WEBSITE / SOCIAL -->
      <td style="padding: 0 0 0 24px; vertical-align: middle; border-left: 2px solid #1C2458">
        <p style="margin: 0; font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.5; color: #666666" data-codetwo-visible="Company address">21516 Carson Dr</p>
        <p style="margin: 0; font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.5; color: #666666" data-codetwo-visible="Company address">Land O' Lakes, FL 34639</p>
        <p style="margin: 6pt 0 0 0; font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.5" data-codetwo-visible="Website">
          <a href="https://wtrdr.com/" target="_blank" style="color: #1C2458; text-decoration: none"><b>wtrdr.com</b></a>
        </p>
        <!-- SOCIAL ICONS: brand badges (blue #2E6DA6), hosted at assets.purple-standard.app. -->
        <table cellspacing="0" cellpadding="0" style="border-collapse: collapse; line-height: initial; margin-top: 10px" data-codetwo-visible="Social links">
          <tbody>
            <tr>
              <td style="padding: 0 15px 0 0; vertical-align: middle">
                <a href="https://g.page/r/CXbaZrIdtlq-EBM/review" class="socialLink" target="_blank"><img src="https://assets.purple-standard.app/wtrdr/email-signature/badge-google.png" border="0" alt="Google" width="28" height="28" style="width: 28px; height: 28px"></a>
              </td>
              <td style="padding: 0 15px 0 0; vertical-align: middle">
                <a href="https://www.facebook.com/profile.php?id=61574883176668" class="socialLink" target="_blank"><img src="https://assets.purple-standard.app/wtrdr/email-signature/badge-facebook.png" border="0" alt="Facebook" width="28" height="28" style="width: 28px; height: 28px"></a>
              </td>
              <td style="padding: 0; vertical-align: middle">
                <a href="https://www.instagram.com/wtrdr_" class="socialLink" target="_blank"><img src="https://assets.purple-standard.app/wtrdr/email-signature/badge-instagram.png" border="0" alt="Instagram" width="28" height="28" style="width: 28px; height: 28px"></a>
              </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
  </tbody>
</table>
<p style="margin: 0.1pt; font-family: Arial; font-size: 10pt"><br></p>
