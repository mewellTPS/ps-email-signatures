<!-- ACE Septic & Waste — C-SUITE (option D, brand stripe) — CodeTwo Email Signatures 365 (dynamic) -->
<!-- Paste into the rule's Design step (HTML/source view), then upload the
     assets/ images via the editor's image tool so CodeTwo rehosts them.
     Placeholder and remove-if-empty tokens live in the body only, never in comments. -->
<table cellspacing="0" cellpadding="0" style="width: 440px; border-collapse: collapse; line-height: initial">
  <tbody>
    <!-- Row 1: four-colour brand stripe (table cells, survives image blocking) -->
    <tr>
      <td style="width: 440px; padding: 0" colspan="2">
        <table cellspacing="0" cellpadding="0" style="width: 440px; border-collapse: collapse">
          <tbody>
            <tr>
              <td style="width: 110px; height: 4px; padding: 0; background-color: #3C81F5; font-size: 0; line-height: 0">&nbsp;</td>
              <td style="width: 110px; height: 4px; padding: 0; background-color: #0BA94B; font-size: 0; line-height: 0">&nbsp;</td>
              <td style="width: 110px; height: 4px; padding: 0; background-color: #F16522; font-size: 0; line-height: 0">&nbsp;</td>
              <td style="width: 110px; height: 4px; padding: 0; background-color: #335E89; font-size: 0; line-height: 0">&nbsp;</td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
    <!-- Row 2: name / title  |  logo -->
    <tr>
      <td style="width: 260px; padding: 14px 0 0 0; vertical-align: middle">
        <p style="margin: 0; font-family: Arial, sans-serif; font-size: 15pt; line-height: 1.15; color: #111111" data-codetwo-visible="Name">
          <b>{First name} {Last name}</b>
        </p>
        <p style="margin: 3px 0 0 0; font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.3; color: #335E89" data-codetwo-visible="Job title">
          {RT}{Title}{/RT}
        </p>
      </td>
      <td style="width: 180px; padding: 14px 0 0 0; vertical-align: middle; text-align: right">
        <p style="margin: 0; font-family: Arial, sans-serif; font-size: 10pt; text-align: right" data-codetwo-visible="Logo">
          <a href="https://acesepticandwaste.com" target="_blank"><img src="assets/ace-logo.png" border="0" alt="ACE Septic & Waste" width="140" height="53" style="width: 140px; height: 53px"></a>
        </p>
      </td>
    </tr>
    <!-- Row 3: contact block (full width) -->
    <tr>
      <td style="width: 440px; padding: 12px 0 0 0; vertical-align: top" colspan="2">
        <p style="margin: 0; font-family: Arial, sans-serif; font-size: 9pt; line-height: 1.6; color: #555555" data-codetwo-visible="Phone">
          {RT}<span style="color: #8A8F98">M</span>&nbsp; <a href="tel:{Mobile}" style="color: #555555; text-decoration: none">{Mobile}</a>&nbsp;&nbsp;<span style="color: #C9CED6">|</span>&nbsp;&nbsp;{/RT}{RT}<span style="color: #8A8F98">O</span>&nbsp; <a href="tel:{Phone}" style="color: #555555; text-decoration: none">{Phone}</a>&nbsp;&nbsp;<span style="color: #C9CED6">|</span>&nbsp;&nbsp;{/RT}{RT}<a href="mailto:{E-mail}" style="color: #555555; text-decoration: none">{E-mail}</a>{/RT}
        </p>
        <p style="margin: 0; font-family: Arial, sans-serif; font-size: 9pt; line-height: 1.6; color: #555555" data-codetwo-visible="Company address">
          8005 Land O' Lakes Blvd, Land O' Lakes, FL 34638
        </p>
      </td>
    </tr>
    <!-- Row 4: website  |  social links -->
    <tr>
      <td style="width: 260px; padding: 10px 0 0 0; vertical-align: middle">
        <p style="margin: 0; font-family: Arial, sans-serif; font-size: 9pt" data-codetwo-visible="Website">
          <a href="https://acesepticandwaste.com" target="_blank" style="color: #0BA94B; text-decoration: none"><b>acesepticandwaste.com</b></a>

      </td>
      <td style="width: 180px; padding: 10px 0 0 0; vertical-align: middle">

              </td>
            </tr>
          </tbody>
        </table>

    </tr>
    <!-- Row 5: Powered by The Purple Standard -->
    <tr>
      <td style="width: 440px; padding: 14px 0 0 0; vertical-align: top" colspan="2">
        <p style="margin: 0; font-family: Arial, sans-serif; font-size: 10pt">
          <img src="assets/ps-endorsement.png" border="0" alt="Powered by The Purple Standard" width="200" height="10" style="width: 200px; height: 10px; display: block">
