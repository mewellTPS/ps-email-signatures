<!-- Brisa Climate - COMPACT STACKED layout candidate (CodeTwo-ready). Stacked logo left, contact right, endorsement and banner below. -->
<!-- Name, Title, Phone, Mobile, and E-mail resolve from Entra via CodeTwo; each dynamic line is RT-wrapped so it hides when empty. -->
<!-- Do not write brace tokens in comments - CodeTwo scans the whole source and treats a stray one as a malformed RT tag. -->
<table cellspacing="0" cellpadding="0" id="brisa-signature" style="border-collapse: collapse; line-height: initial">
  <tbody>
    <tr>
      <!-- Stacked logo (bear over BRISA CLIMATE), 2x source is 224x296 -->
      <td style="padding: 0 20px 0 0; vertical-align: middle" data-codetwo-visible="Logo">
        <a href="https://brisaclimate.com/" target="_blank"><img src="https://assets.purple-standard.app/brisa/email-signature/brisa-logo-stacked.png" border="0" alt="Brisa Climate" width="112" height="148" style="width: 112px; height: 148px; display: block"></a>
      </td>

      <!-- Contact column (purple divider = left border) -->
      <td style="padding: 0 0 0 20px; vertical-align: middle; border-left: 2px solid #48104F">
        <p style="margin: 0; font-family: Arial, sans-serif; font-size: 13pt; line-height: 1.1; color: #48104F" data-codetwo-visible="Name"><b>{First name} {Last name}</b></p>
        <p style="margin: 2px 0 0 0; font-family: Arial, sans-serif; font-size: 10pt; color: #7a7a7a" data-codetwo-visible="Job title">{RT}{Title}{/RT}</p>
        <p style="margin: 8px 0 0 0; font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.45; color: #2a2a2a" data-codetwo-visible="Phone">{RT}<b style="color: #48104F">P:</b> <a href="tel:{Phone}" style="color: #2a2a2a; text-decoration: none">{Phone}</a>{/RT}</p>
        <p style="margin: 0; font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.45; color: #2a2a2a" data-codetwo-visible="Mobile">{RT}<b style="color: #48104F">M:</b> <a href="tel:{Mobile}" style="color: #2a2a2a; text-decoration: none">{Mobile}</a>{/RT}</p>
        <p style="margin: 0; font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.45; color: #2a2a2a" data-codetwo-visible="Email">{RT}<b style="color: #48104F">E:</b> <a href="mailto:{E-mail}" style="color: #2a2a2a; text-decoration: none">{E-mail}</a>{/RT}</p>
        <p style="margin: 0; font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.45; color: #2a2a2a" data-codetwo-visible="Company address">21516 Carson Dr, Land O' Lakes, FL 34639</p>
        <p style="margin: 0; font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.45" data-codetwo-visible="Website"><a href="https://brisaclimate.com/" target="_blank" style="color: #48104F; text-decoration: none"><b>www.brisaclimate.com</b></a></p>
        <p style="margin: 8px 0 0 0; font-size: 0; line-height: 0" data-codetwo-visible="Social links"><a href="https://www.facebook.com/profile.php?id=61589534684038" target="_blank" style="text-decoration: none"><img src="https://assets.purple-standard.app/brisa/email-signature/badge-facebook.png" border="0" alt="Facebook" width="22" height="22" style="width: 22px; height: 22px; display: inline-block; margin-right: 6px"></a><a href="https://www.instagram.com/brisa.climate.solutions/" target="_blank" style="text-decoration: none"><img src="https://assets.purple-standard.app/brisa/email-signature/badge-instagram.png" border="0" alt="Instagram" width="22" height="22" style="width: 22px; height: 22px; display: inline-block; margin-right: 6px"></a><a href="https://share.google/jLJBkU8jqKbZe51le" target="_blank" style="text-decoration: none"><img src="https://assets.purple-standard.app/brisa/email-signature/badge-google.png" border="0" alt="Google" width="22" height="22" style="width: 22px; height: 22px; display: inline-block"></a></p>
      </td>
    </tr>

    <!-- Powered by The Purple Standard (shared PS endorsement, white pill for dark mode per ADR 0015), 2x source is 1000x48 -->
    <tr>
      <td colspan="2" style="padding: 12px 0 0 0; vertical-align: top" data-codetwo-visible="Endorsement">
        <a href="https://www.purple-standard.com/" target="_blank"><img src="https://assets.purple-standard.app/standard/email-signature/tps-endorsement.png" border="0" alt="Powered by The Purple Standard" width="250" height="12" style="width: 250px; height: 12px; display: block"></a>
      </td>
    </tr>

    <!-- Promo banner -> Google "Leave Us a Review" deep link (distinct from the badge's general GMB link; do not merge). 2x source is 1400x342. -->

        <a href="https://share.google/AfTfkPPBgOVDHaqi2" target="_blank"><img src="https://assets.purple-standard.app/brisa/email-signature/banner-web.png" border="0" alt="The reason you keep your cool — help spread the word, leave us a review." width="430" height="105" style="width: 430px; height: 105px; display: block"></a>
