<!-- Brisa Climate email signature - STANDARDIZED DEFAULT (CodeTwo-ready). No per-user content is hardcoded. -->
<!-- Name, Title, Phone, Mobile, and E-mail resolve from Entra via CodeTwo; each dynamic line is wrapped in -->
<!-- RT tags (see body) so it auto-hides when empty. Company address, social URLs (Facebook, Instagram, -->
<!-- Google), and the logo/banner are org-level (shared by all Brisa accounts). -->
<!-- NOTE: keep RT tags and placeholders in the signature body only. Do not write brace tokens in comments - -->
<!-- CodeTwo scans the whole source and treats a stray brace token in a comment as a malformed RT tag. -->
<table cellspacing="0" cellpadding="0" id="brisa-signature" style="width: 700px; border-collapse: collapse; line-height: initial">
  <tbody>
    <!-- Top: combined logo (left half) | divider | contact (right half) -->
    <tr>
      <!-- Left half: combined logo lockup (mark + wordmark + Powered-by endorsement in one image) -->
      <td style="width: 340px; padding: 0; vertical-align: top">
        <p style="margin: 0" data-codetwo-visible="Logo">
          <a href="https://brisaclimate.com/" target="_blank"><img src="https://assets.purple-standard.app/brisa/email-signature/brisa-logo.png" border="0" alt="Brisa Climate — Powered by The Purple Standard" width="300" height="165" style="width: 300px; height: 165px; display: block"></a>
        </p>
      </td>

      <!-- Right half: contact (vertical purple divider = left border of this cell) -->
      <td style="padding: 0 0 0 30px; vertical-align: top; border-left: 2px solid #48104F">
        <!-- Name -->
        <p style="margin: 0 0 1px 0; font-family: Arial, sans-serif; font-size: 14pt; color: #48104F; line-height: 1.1" data-codetwo-visible="Name"><b>{First name} {Last name}</b></p>
        <!-- Title -->
        <p style="margin: 0 0 16px 0; font-family: Arial, sans-serif; font-size: 10.5pt; color: #7a7a7a" data-codetwo-visible="Job title">{RT}{Title}{/RT}</p>

        <!-- Aligned 2-column contact grid: P|M, E|www, City|Zip -->
        <table cellspacing="0" cellpadding="0" style="border-collapse: collapse; line-height: initial">
          <tbody>
            <tr>
              <td style="width: 175px; padding: 0 22px 8px 0; font-family: Arial, sans-serif; font-size: 10.5pt; color: #2a2a2a; white-space: nowrap" data-codetwo-visible="Phone">{RT}<b style="color: #48104F">P:</b> <a href="tel:{Phone}" style="color: #2a2a2a; text-decoration: none">{Phone}</a>{/RT}</td>
              <td style="padding: 0 0 8px 0; font-family: Arial, sans-serif; font-size: 10.5pt; color: #2a2a2a; white-space: nowrap" data-codetwo-visible="Mobile">{RT}<b style="color: #48104F">M:</b> <a href="tel:{Mobile}" style="color: #2a2a2a; text-decoration: none">{Mobile}</a>{/RT}</td>
            </tr>
            <tr>
              <td style="padding: 0 22px 8px 0; font-family: Arial, sans-serif; font-size: 10.5pt; color: #2a2a2a; white-space: nowrap" data-codetwo-visible="Email">{RT}<b style="color: #48104F">E:</b> <a href="mailto:{E-mail}" style="color: #2a2a2a; text-decoration: none">{E-mail}</a>{/RT}</td>
              <td style="padding: 0 0 8px 0; font-family: Arial, sans-serif; font-size: 10.5pt; white-space: nowrap"><a href="https://brisaclimate.com/" target="_blank" style="color: #48104F; text-decoration: none"><b>www.brisaclimate.com</b></a></td>
            </tr>
            <!-- Company address -->
            <tr>
              <td style="padding: 0 22px 14px 0; font-family: Arial, sans-serif; font-size: 10.5pt; color: #2a2a2a; white-space: nowrap">21516 Carson Dr</td>
              <td style="padding: 0 0 14px 0; font-family: Arial, sans-serif; font-size: 10.5pt; color: #2a2a2a; white-space: nowrap">Land O' Lakes, FL 34639</td>
            </tr>
            <!-- Social icons. Facebook + Instagram + Google (GBP) linked. -->
            <tr>
              <td colspan="2" style="padding: 0; font-size: 0; line-height: 0">
                <a href="https://www.facebook.com/profile.php?id=61589534684038" target="_blank" style="text-decoration: none"><img src="https://assets.purple-standard.app/brisa/email-signature/badge-facebook.png" border="0" alt="Facebook" width="25" height="25" style="width: 25px; height: 25px; display: inline-block; margin-right: 7px"></a><a href="https://www.instagram.com/brisa.climate.solutions/" target="_blank" style="text-decoration: none"><img src="https://assets.purple-standard.app/brisa/email-signature/badge-instagram.png" border="0" alt="Instagram" width="25" height="25" style="width: 25px; height: 25px; display: inline-block; margin-right: 7px"></a><a href="https://share.google/jLJBkU8jqKbZe51le" target="_blank" style="text-decoration: none"><img src="https://assets.purple-standard.app/brisa/email-signature/badge-google.png" border="0" alt="Google" width="25" height="25" style="width: 25px; height: 25px; display: inline-block"></a>
              </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>

    <!-- Spacer above banner -->
    <tr><td colspan="2" style="height: 20px; font-size: 0; line-height: 0">&nbsp;</td></tr>

    <!-- Full-width promo banner -> Google "Leave Us a Review" deep link (distinct from the badge's general GMB link; do not merge). -->
    <tr>
      <td colspan="2" style="padding: 0; vertical-align: top">
        <p style="margin: 0" data-codetwo-visible="Banner">
          <a href="https://share.google/AfTfkPPBgOVDHaqi2" target="_blank"><img src="https://assets.purple-standard.app/brisa/email-signature/banner-web.png" border="0" alt="The reason you keep your cool — help spread the word, leave us a review." width="700" height="171" style="width: 700px; height: 171px; display: block"></a>
        </p>
      </td>
    </tr>
  </tbody>
</table>
